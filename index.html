<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>100 причин, почему я тебя люблю</title>
    <meta
      name="description"
      content="Сайт с 100 причинами, почему я люблю тебя, моя дорогая."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="floating-hearts" aria-hidden="true"></div>

    <header class="hero">
      <p class="eyebrow">Для тебя, моя любовь</p>
      <h1>100 причин,<br />почему я тебя люблю</h1>
      <p class="subtitle">
        Потому что ты — мой самый счастливый день, моя самая тихая радость и
        мой самый большой смысл.
      </p>
      <button id="revealBtn" class="cta">Показать причины</button>
    </header>

    <main class="content">
      <div id="reasonsGrid" class="reasons-grid" aria-live="polite"></div>
    </main>

    <footer class="final-note">
      <p>И ещё одна причина: я люблю тебя — просто потому что ты есть.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
